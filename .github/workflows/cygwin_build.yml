name: Cygwin Build

on:
  push:
    paths-ignore:
      # remove other vehicles
      - 'AntennaTracker/**'
      - 'Blimp/**'
      # remove non SITL HAL
      - 'libraries/AP_HAL_ChibiOS/**'
      - 'libraries/AP_HAL_ESP32/**'
      - 'libraries/AP_HAL_QURT/**'
      # remove non SITL directories
      - 'Tools/AP_Bootloader/**'
      - 'Tools/AP_Periph/**'
      - 'Tools/CHDK-Script/**'
      - 'Tools/CPUInfo/**'
      - 'Tools/CodeStyle/**'
      - 'Tools/FilterTestTool/**'
      - 'Tools/Frame_params/**'
      - 'Tools/GIT_Test/**'
      - 'Tools/Hello/**'
      - 'Tools/IO_Firmware/**'
      - 'Tools/Linux_HAL_Essentials/**'
      - 'Tools/Pozyx/**'
      - 'Tools/PrintVersion.py'
      - 'Tools/Replay/**'
      - 'Tools/UDP_Proxy/**'
      - 'Tools/Vicon/**'
      - 'Tools/bootloaders/**'
      - 'Tools/completion/**'
      - 'Tools/debug/**'
      - 'Tools/environment_install/**'
      - 'Tools/geotag/**'
      - 'Tools/gittools/**'
      - 'Tools/mavproxy_modules/**'
      - 'Tools/simulink/**'
      - 'Tools/vagrant/**'
      # Discard python file from Tools/scripts as not used
      - 'Tools/scripts/**.py'
      - 'Tools/scripts/build_sizes/**'
      - 'Tools/scripts/build_tests/**'
      - 'Tools/scripts/CAN/**'
      - 'Tools/scripts/signing/**'
      # Remove autotest
      - 'Tools/autotest/**'
      # Remove markdown files as irrelevant
      - '**.md'
      # Remove dotfile at root directory
      - '.dir-locals.el'
      - '.dockerignore'
      - '.editorconfig'
      - '.flake8'
      - '.gitattributes'
      - '.github'
      - '.gitignore'
      - '.pre-commit-config.yaml'
      - '.pydevproject'
      - '.valgrind-suppressions'
      - '.valgrindrc'
      - 'Dockerfile'
      - 'Vagrantfile'
      - 'Makefile'
      # Remove some directories check
      - '.vscode/**'
      - '.github/ISSUE_TEMPLATE/**'
      # Remove change on other workflows
      - '.github/**'
      - '!.github/workflows/cygwin_build.yml'  # except this one

  pull_request:
    paths-ignore:
      # remove other vehicles
      - 'AntennaTracker/**'
      - 'Blimp/**'
      # remove non SITL HAL
      - 'libraries/AP_HAL_ChibiOS/**'
      - 'libraries/AP_HAL_ESP32/**'
      - 'libraries/AP_HAL_QURT/**'
      # remove non SITL directories
      - 'Tools/AP_Bootloader/**'
      - 'Tools/AP_Periph/**'
      - 'Tools/bootloaders/**'
      - 'Tools/CHDK-Script/**'
      - 'Tools/CodeStyle/**'
      - 'Tools/completion/**'
      - 'Tools/CPUInfo/**'
      - 'Tools/debug/**'
      - 'Tools/environment_install/**'
      - 'Tools/FilterTestTool/**'
      - 'Tools/Frame_params/**'
      - 'Tools/geotag/**'
      - 'Tools/GIT_Test/**'
      - 'Tools/gittools/**'
      - 'Tools/Hello/**'
      - 'Tools/IO_Firmware/**'
      - 'Tools/Linux_HAL_Essentials/**'
      - 'Tools/LogAnalyzer/**'
      - 'Tools/mavproxy_modules/**'
      - 'Tools/Pozyx/**'
      - 'Tools/PrintVersion.py'
      - 'Tools/Replay/**'
      - 'Tools/simulink/**'
      - 'Tools/UDP_Proxy/**'
      - 'Tools/vagrant/**'
      - 'Tools/Vicon/**'
      # Discard python file from Tools/scripts as not used
      - 'Tools/scripts/**.py'
      - 'Tools/scripts/build_sizes/**'
      - 'Tools/scripts/build_tests/**'
      - 'Tools/scripts/CAN/**'
      - 'Tools/scripts/signing/**'
      # Remove autotest
      - 'Tools/autotest/**'
      # Remove markdown files as irrelevant
      - '**.md'
      # Remove dotfile at root directory
      - '.dir-locals.el'
      - '.dockerignore'
      - '.editorconfig'
      - '.flake8'
      - '.gitattributes'
      - '.github'
      - '.gitignore'
      - '.pre-commit-config.yaml'
      - '.pydevproject'
      - '.valgrind-suppressions'
      - '.valgrindrc'
      - 'Dockerfile'
      - 'Vagrantfile'
      - 'Makefile'
      # Remove some directories check
      - '.vscode/**'
      - '.github/ISSUE_TEMPLATE/**'
      # Remove change on other workflows
      - '.github/**'
      - '!.github/workflows/cygwin_build.yml'  # except this one

  workflow_dispatch:

concurrency:
  group: ci-${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read  # checkout; build adds actions:write per-job

jobs:
  build:
    permissions:
      contents: read
      actions: write  # save/prune ccache on master
    runs-on: 'windows-latest'

    steps:
      # P4 (branch p4-wdj1): modules/mavlink's gitlink 0dafe8cab2 is a
      # local-only commit (MPC_TRAJECTORY, id 11061), so a recursive
      # checkout cannot fetch it.  Check out without submodules, init every
      # submodule except mavlink, then take mavlink's upstream parent
      # 13f2f7351a and re-insert the one message
      # (Tools/scripts/p4_cygwin/mavlink_add_mpc_trajectory.py).
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Submodules (mavlink = upstream parent + MPC_TRAJECTORY)
        shell: bash
        run: |
          set -ex
          git submodule init
          git config submodule.modules/mavlink.update none
          git submodule update --recursive --depth 1 || git submodule update --recursive
          rm -rf modules/mavlink
          git init modules/mavlink
          git -C modules/mavlink config core.autocrlf false
          git -C modules/mavlink remote add origin https://github.com/ArduPilot/mavlink
          git -C modules/mavlink fetch --depth 1 origin 13f2f7351a9bdf5292a2c243eb9a2c19ff4b6472
          git -C modules/mavlink checkout FETCH_HEAD
          git -C modules/mavlink submodule update --init --recursive --depth 1 || git -C modules/mavlink submodule update --init --recursive
          python Tools/scripts/p4_cygwin/mavlink_add_mpc_trajectory.py modules/mavlink/message_definitions/v1.0/ardupilotmega.xml
          grep -c 'name="MPC_TRAJECTORY"' modules/mavlink/message_definitions/v1.0/ardupilotmega.xml
          git submodule status
      - uses: cygwin/cygwin-install-action@v6
        with:
          packages: cygwin64 gcc-g++=13.4.0-1 ccache python312 python312-pip git procps gettext
          add-to-path: false
      # Put ccache into github cache for faster build
      - name: setup ccache
        env:
          PATH: /usr/bin:$(cygpath ${SYSTEMROOT})/system32
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: >-
          CYGPATH_GITHUB_WORKSPACE=$(cygpath -u "$GITHUB_WORKSPACE") &&
          mkdir -p "${CYGPATH_GITHUB_WORKSPACE}/ccache" &&
          mkdir -p /usr/local/etc &&
          echo "export CCACHE_SLOPPINESS=file_stat_matches,include_file_ctime,include_file_mtime,time_macros" >> ~/ccache.conf &&
          echo "export CCACHE_DIR=${CYGPATH_GITHUB_WORKSPACE}/ccache" >> ~/ccache.conf &&
          echo "export CCACHE_BASEDIR=${CYGPATH_GITHUB_WORKSPACE}" >> ~/ccache.conf &&
          echo "export CCACHE_COMPRESS=1" >> ~/ccache.conf &&
          echo "export CCACHE_COMPRESSLEVEL=6" >> ~/ccache.conf &&
          echo "export CCACHE_MAXSIZE=400M" >> ~/ccache.conf &&
          source ~/ccache.conf &&
          ccache -s
      - uses: ./.github/actions/setup-ccache
        with:
          key-suffix: cygwin-sitl-p4
      - name: Prepare Python environment
        env:
          PATH: /usr/bin:$(cygpath ${SYSTEMROOT})/system32
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: >-
          python3 --version &&
          python3 -m pip install --progress-bar off empy==3.3.4 pexpect &&
          python3 -m pip install --progress-bar off dronecan --upgrade &&
          cp /usr/bin/ccache /usr/local/bin/ &&
          cd /usr/local/bin && ln -s ccache /usr/local/bin/gcc &&
          ln -s ccache /usr/local/bin/g++ &&
          ln -s ccache /usr/local/bin/x86_64-pc-cygwin-gcc &&
          ln -s ccache /usr/local/bin/x86_64-pc-cygwin-g++

      - name: Build SITL (ArduCopter, BSLV_ARC=1)
        env:
          PATH: /usr/bin:$(cygpath ${SYSTEMROOT})/system32
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: >-
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}" &&
          CYGPATH_GITHUB_WORKSPACE=$(cygpath -u "$GITHUB_WORKSPACE") &&
          git config --global --add safe.directory '*' &&
          export PATH=/usr/local/bin:/usr/bin:$(cygpath ${SYSTEMROOT})/system32 &&
          source ~/ccache.conf &&
          bash Tools/scripts/p4_cygwin/cygwin_build_p4.sh &&
          ccache -s
      - uses: ./.github/actions/save-ccache

      - name: Check build files
        id: check_files
        uses: andstor/file-existence-action@v3
        with:
          files: "artifacts/ArduCopter.elf.exe, artifacts/cygwin1.dll"
          fail: true

      - name: Archive build
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: artifacts
          retention-days: 7

      # Smoke tests, NON-BLOCKING (the artifact is already uploaded); both fly
      # the turns mission with native Windows Python + pymavlink.
      # Pass 1 (smoke/): the ROMFS variant -- empty cwd, model and parameters
      # from @ROMFS/models/, -w.  Pass 2 (smoke_mp/): the argument list Mission
      # Planner's SITL dialog builds (GCSViews/SITL.cs StartSITL) with the P4
      # extra command line of 01 section 3: cwd holds SN77.json + p4_sitl.parm,
      # MP's own --defaults "<absolute Windows path>\copter.parm" comes first,
      # --wipe last.  Each pass also requires 'Loaded model params from
      # SN77.json' on the SITL console.
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: '3.12'
      - name: Smoke test (turns mission, BSLV statustexts)
        id: smoke
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          set +e
          set -x
          python -m pip install --progress-bar off pymavlink
          mkdir -p smoke/run
          cd smoke/run
          ../../artifacts/ArduCopter.elf.exe -M+ -O50.2917,10.3986,0,0 -s1 --serial0 tcp:0 \
            --model +:SN77.json --defaults @ROMFS/models/p4_sitl.parm \
            --home 50.2917,10.3986,0,0 -w > ../sitl_stdout.txt 2>&1 &
          sleep 5
          cd ..
          python ../Tools/scripts/p4_cygwin/smoke_sitl.py ../Tools/scripts/p4_cygwin/turns.waypoints . 2>&1 | tee smoke_log.txt
          rc=${PIPESTATUS[0]}
          taskkill //F //IM ArduCopter.elf.exe || true
          sleep 2
          ls -la run || true
          grep -q "Loaded model params from SN77.json" sitl_stdout.txt || { echo "model SN77.json not loaded"; rc=1; }
          exit $rc
      - name: Smoke test 2 (Mission Planner argument list)
        id: smoke_mp
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          set +e
          set -x
          mkdir -p smoke_mp/run
          cp Tools/scripts/p4_cygwin/p4_sitl.parm smoke_mp/run/
          cp artifacts/SN77.json smoke_mp/run/
          cp Tools/autotest/default_params/copter.parm smoke_mp/copter.parm
          MP_PARM="$(cd smoke_mp && pwd -W)\\copter.parm"
          cd smoke_mp/run
          ../../artifacts/ArduCopter.elf.exe -M+ -O50.2917,10.3986,300,0 -s1 --serial0 tcp:0 \
            --defaults "$MP_PARM" \
            --model +:SN77.json --defaults p4_sitl.parm --home 50.2917,10.3986,0,0 \
            --wipe > ../sitl_stdout.txt 2>&1 &
          sleep 5
          cd ..
          python ../Tools/scripts/p4_cygwin/smoke_sitl.py ../Tools/scripts/p4_cygwin/turns.waypoints . 2>&1 | tee smoke_log.txt
          rc=${PIPESTATUS[0]}
          taskkill //F //IM ArduCopter.elf.exe || true
          sleep 2
          ls -la run || true
          grep -q "Loaded model params from SN77.json" sitl_stdout.txt || { echo "model SN77.json not loaded"; rc=1; }
          exit $rc
      - name: Smoke test result
        if: always()
        shell: bash
        run: |
          echo "smoke outcome (ROMFS): ${{ steps.smoke.outcome }}"
          echo "smoke outcome (Mission Planner args): ${{ steps.smoke_mp.outcome }}"
          cat smoke/smoke_result.json || true
          cat smoke_mp/smoke_result.json || true
          tail -50 smoke/sitl_stdout.txt || true
          tail -50 smoke_mp/sitl_stdout.txt || true
      - name: Archive smoke logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs
          path: |
            smoke/smoke_log.txt
            smoke/smoke_result.json
            smoke/sitl_stdout.txt
            smoke/run/logs/
            smoke_mp/smoke_log.txt
            smoke_mp/smoke_result.json
            smoke_mp/sitl_stdout.txt
            smoke_mp/run/logs/
          retention-days: 7
